# forge for the baseline benchmark: the production manifests (deploy/overlays/k3d) with only
# what a fixed-replica benchmark needs changed:
#   - no HPA (replicas are set explicitly by tests/baseline/k8s.sh: 1 or 3)
#   - no gc CronJob (it runs hourly; it must not fire in the middle of a measurement)
#   - FORGE_BASE_URL on the benchmark host port 8088
# Pod resources stay exactly as in deploy/base (forge 250m/256Mi request, 2 CPU/1Gi limit;
# Postgres 4 CPU/1536Mi limit), which tests/baseline/forgejo/ mirrors for Forgejo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy/overlays/k3d
configMapGenerator:
  - name: forge-config
    namespace: forge
    behavior: merge
    literals:
      - FORGE_BASE_URL=http://localhost:8088
patches:
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: {name: forge, namespace: forge}
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata: {name: forge-gc, namespace: forge}

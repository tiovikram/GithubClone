# Needs metrics-server (bundled with k3d/k3s and most managed clusters; scripts/k8s/up.sh
# installs it on kind as part of cluster creation).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forge
  labels: {app.kubernetes.io/name: forge}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forge
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120

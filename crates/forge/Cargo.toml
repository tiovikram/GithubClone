[package]
name = "forge"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.3"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-compression = { version = "0.4.50", features = ["tokio", "gzip"] }
aws-lc-rs = "1.18.2"
async-graphql = { version = "7.2.1", features = ["chrono", "dataloader"] }
async-graphql-axum = "7.2.1"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
blake2 = "0.11.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
curve25519-dalek = "5.0.0"
comrak = { version = "0.56.0", default-features = false }
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13"
mime_guess = "2.0.5"
object_store = { version = "0.14.2", features = ["aws"] }
poly1305 = "0.9.1"
percent-encoding = "2.3.2"
rand = "0.10.3"
russh = "0.64.1"
reqwest = { version = "0.13.5", features = ["json"] }
salsa20 = "0.11.0"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "migrate", "json", "macros"] }
tar = "0.4"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io", "compat"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "compression-gzip", "request-id", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json", "cookies"] }
tempfile = "3.27.0"
